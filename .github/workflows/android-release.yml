name: Android release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact deployed commit (or a ref for a manual release)
        default: main
        type: string
      deployment_run:
        description: Production deployment correlation ID
        default: manual
        type: string
      cafebazaar:
        description: Also submit this release to Cafe Bazaar for review
        type: boolean
        default: false

run-name: Android release for deploy ${{ inputs.deployment_run }}

permissions:
  actions: read
  contents: write

concurrency:
  group: android-release-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.ref || github.sha }}
      CAFEBAZAAR_PUBLISH: ${{ inputs.cafebazaar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Resolve checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate automatic publication credentials
        if: env.CAFEBAZAAR_PUBLISH == 'true'
        shell: bash
        env:
          CAFEBAZAAR_API_SECRET: ${{ secrets.CAFEBAZAAR_API_SECRET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for name in CAFEBAZAAR_API_SECRET ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required publication secret is missing: $name"
              exit 1
            fi
          done

      - name: Prepare automatic version
        id: version
        shell: bash
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "name=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      - name: Configure Android release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" && -n "${ANDROID_STORE_PASSWORD}" ]]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/release.jks
            {
              printf 'storePassword=%s\n' "${ANDROID_STORE_PASSWORD}"
              printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
              printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
              printf 'storeFile=release.jks\n'
            } > android/key.properties
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            echo "label=production-signed" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Android release signing secrets are missing; building test-signed packages with the debug key and skipping GitHub Release publication."
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "label=test-signed" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build Android packages
        shell: bash
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=API_BASE_URL=${{ vars.NAFIR_API_BASE_URL || 'https://rhythmo.ir' }}
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=API_BASE_URL=${{ vars.NAFIR_API_BASE_URL || 'https://rhythmo.ir' }}
          mv build/app/outputs/flutter-apk/app-release.apk \
            "rhythmo-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.apk"
          mv build/app/outputs/bundle/release/app-release.aab \
            "rhythmo-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.aab"

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: rhythmo-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}
          path: |
            rhythmo-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.apk
            rhythmo-${{ steps.version.outputs.tag }}-android-${{ steps.signing.outputs.label }}.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.revision.outputs.sha }}
          name: rhythmo ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            rhythmo-${{ steps.version.outputs.tag }}-android-production-signed.apk
            rhythmo-${{ steps.version.outputs.tag }}-android-production-signed.aab

      - name: Submit to Cafe Bazaar
        if: steps.signing.outputs.configured == 'true' && env.CAFEBAZAAR_PUBLISH == 'true'
        env:
          CAFEBAZAAR_API_SECRET: ${{ secrets.CAFEBAZAAR_API_SECRET }}
          CAFEBAZAAR_AUTO_PUBLISH: 'true'
          CAFEBAZAAR_ROLLOUT_PERCENT: ${{ vars.CAFEBAZAAR_ROLLOUT_PERCENT || '100' }}
        run: >-
          scripts/publish-cafebazaar.sh
          "rhythmo-${{ steps.version.outputs.tag }}-android-production-signed.apk"
          "${{ steps.version.outputs.name }}"
