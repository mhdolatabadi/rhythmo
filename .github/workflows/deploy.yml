name: Deploy

on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to deploy
        required: false
        default: main

permissions:
  actions: write
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Resolve deploy commit
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for immutable images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            state="$(gh run list --workflow images.yml --commit "$DEPLOY_SHA"               --limit 1 --json status,conclusion               --jq 'if length == 0 then "waiting" else .[0].status + ":" + (. [0].conclusion // "") end')"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "Images workflow failed: $state" >&2; exit 1 ;;
              *) echo "Waiting for images for $DEPLOY_SHA ($state)"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for immutable images." >&2
          exit 1

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate the production revision and registry
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          PRODUCTION_IMAGE_REPO: ${{ vars.PRODUCTION_IMAGE_REPO }}
        run: |
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          state="$(gh run list --workflow ci.yml --commit "$DEPLOY_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion')"
          [[ "$state" == success ]] || { echo 'This production revision has not passed main CI.' >&2; exit 1; }
          : "${PRODUCTION_IMAGE_REPO:?An owned regional registry is required}"
          python3 - "$PRODUCTION_IMAGE_REPO" <<'PYTHON'
          import re, sys
          repo = sys.argv[1]
          assert re.fullmatch(r'[a-z0-9][a-z0-9.-]*(?::[0-9]+)?/[a-z0-9][a-z0-9._/-]*', repo)
          assert '.' in repo.split('/')[0]
          assert '..' not in repo and '//' not in repo
          assert repo.split('/')[0] not in ('ghcr.io', 'mirror-docker.runflare.com')
          PYTHON
          echo "PRODUCTION_REGISTRY=${PRODUCTION_IMAGE_REPO%%/*}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.PRODUCTION_REGISTRY }}
          username: ${{ secrets.PRODUCTION_REGISTRY_USER }}
          password: ${{ secrets.PRODUCTION_REGISTRY_PASSWORD }}

      - name: Verify published native manifests and full pulls
        id: pinned_images
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          PRODUCTION_IMAGE_REPO: ${{ vars.PRODUCTION_IMAGE_REPO }}
        run: |
          for service in api web transcriber; do
            tag="$DEPLOY_SHA"
            if [[ "$service" == transcriber ]]; then tag="src-$(git rev-parse HEAD:server/transcriber)"; fi
            expected="$(docker buildx imagetools inspect "ghcr.io/mhdolatabadi/rhythmo/$service:$tag" --format '{{.Manifest.Digest}}')"
            python3 scripts/resolve-registry-image.py "$PRODUCTION_IMAGE_REPO/$service" "$tag" \
              --expected-root "$expected" --prefix "$service" --output "$GITHUB_OUTPUT"
          done

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is required}"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable commit over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          PRODUCTION_IMAGE_REPO: ${{ vars.PRODUCTION_IMAGE_REPO }}
          API_DIGEST: ${{ steps.pinned_images.outputs.api_digest }}
          API_CONFIG: ${{ steps.pinned_images.outputs.api_config }}
          WEB_CONFIG: ${{ steps.pinned_images.outputs.web_config }}
          TRANSCRIBER_DIGEST: ${{ steps.pinned_images.outputs.transcriber_digest }}
          TRANSCRIBER_CONFIG: ${{ steps.pinned_images.outputs.transcriber_config }}
          WEB_DIGEST: ${{ steps.pinned_images.outputs.web_digest }}
        run: |
          # Execute bootstrap from the validated checkout, not an old on-host script.
          printf -v command 'bash -s -- %q %q %q %q %q %q %q %q %q %q' \
            "$DEPLOY_PATH" "$DEPLOY_SHA" "$API_DIGEST" "$WEB_DIGEST" \
            "$PRODUCTION_IMAGE_REPO" "$API_CONFIG" "$WEB_CONFIG" \
            "$TRANSCRIBER_DIGEST" "$TRANSCRIBER_CONFIG" linux/amd64
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=12 \
            -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "$command" \
            < deploy/remote-deploy.sh

      - name: Load release automation from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-automation

      - name: Publish the deployed revision to Cafe Bazaar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: release-automation/scripts/release-deployed-android.sh
