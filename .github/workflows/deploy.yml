name: Deploy

on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to deploy
        required: false
        default: main

permissions:
  actions: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Resolve deploy commit
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for immutable images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          for attempt in $(seq 1 40); do
            state="$(gh run list --workflow images.yml --commit "$DEPLOY_SHA"               --limit 1 --json status,conclusion               --jq 'if length == 0 then "waiting" else .[0].status + ":" + (. [0].conclusion // "") end')"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "Images workflow failed: $state" >&2; exit 1 ;;
              *) echo "Waiting for images for $DEPLOY_SHA ($state)"; sleep 15 ;;
            esac
          done
          echo "Timed out waiting for immutable images." >&2
          exit 1

      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is required}"

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy immutable commit over SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes             -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST"             "bash '$DEPLOY_PATH/deploy/deploy.sh' '$DEPLOY_SHA'"

      - name: Load release automation from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-automation

      - name: Publish the deployed revision to Cafe Bazaar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: release-automation/scripts/release-deployed-android.sh
