name: rhythmo
description: Private cloud music player with stream-first playback.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  cached_network_image: ^3.4.1
  # Names the files of server answers kept for offline use.
  crypto: ^3.0.7
  # v13 compiles its Android plugin against API 36, matching the lifecycle
  # plugin required by the current Flutter stable toolchain.
  file_picker: ^13.1.0
  flutter_secure_storage: ^10.3.4
  dio: ^5.11.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  # Starts browser downloads on the web.
  web: ^1.1.1
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the sleep timer's countdown and fade in tests.
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/rhythmo.png

  # Bundled so Persian text never waits on a runtime font download from Google.
  fonts:
    # Phosphor icons (MIT), used through lib/core/widgets/rhythmo_icons.dart.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
