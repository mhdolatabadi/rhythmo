server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Behind a TLS proxy, an absolute redirect would point at http://…:80;
    # a relative Location keeps the visitor's own scheme and host.
    absolute_redirect off;

    # Browser hardening for the app (#214). nginx drops these in any location
    # that sets its own add_header, so the service worker repeats them.
    # microphone stays allowed for the app's own song identification.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;

    # The app is built with --base-href /app/ and lives under /app/.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # A new deploy's offline worker must be picked up on the next visit.
    location ~ ^/app/(flutter_service_worker|offline_worker)\.js$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # Everything else belongs to the public pages the API renders, which the
    # proxy in front routes there. If a request still lands here, send it
    # to the app, keeping the query so old ?shared= links open the playlist,
    # rather than showing nginx's stock page (#153).
    location / {
        return 302 /app/$is_args$args;
    }
}
