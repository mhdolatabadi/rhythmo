server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Behind a TLS proxy, an absolute redirect would point at http://…:80;
    # a relative Location keeps the visitor's own scheme and host.
    absolute_redirect off;

    # Browser hardening for the app (#214). nginx drops these in any location
    # that sets its own add_header, so the service worker repeats them.
    # microphone stays allowed for the app's own song identification.
    # The CSP (#218): Flutter needs 'wasm-unsafe-eval' for CanvasKit/skwasm
    # and inline styles; scripts come only from this origin (the splash
    # script lives in splash.js). Audio, artwork and the API may be on any
    # https origin (presigned storage, API_BASE_URL). Checked with
    # tool/csp_smoke: sign in, library, play, with no violations.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;

    # The app is built with --base-href /app/ and lives under /app/.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # A new deploy's offline worker must be picked up on the next visit.
    location ~ ^/app/(flutter_service_worker|offline_worker)\.js$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    }

    # Everything else belongs to the public pages the API renders, which the
    # proxy in front routes there. If a request still lands here, send it
    # to the app, keeping the query so old ?shared= links open the playlist,
    # rather than showing nginx's stock page (#153).
    location / {
        return 302 /app/$is_args$args;
    }
}
