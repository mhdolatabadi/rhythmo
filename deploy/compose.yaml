# A fixed project name, so this stack's containers, networks and volumes
# don't collide with other Compose projects on the same server (by default
# the project would be named after this folder, "deploy").
name: nafir

services:
  api:
    image: ${NAFIR_IMAGE_REPO:-ghcr.io/mhdolatabadi/nafir}/api:${NAFIR_IMAGE_TAG:-latest}
    build:
      context: ../server
    restart: unless-stopped
    environment:
      WEB_ORIGIN: https://${NAFIR_DOMAIN}
      DATABASE_URL: postgres://nafir:${POSTGRES_PASSWORD}@postgres:5432/nafir?sslmode=disable
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Email verification stays off while SMTP_HOST is empty; see README.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_CODE_USER_RATE_REQUESTS: ${EMAIL_CODE_USER_RATE_REQUESTS:-5}
      EMAIL_CODE_USER_RATE_WINDOW: ${EMAIL_CODE_USER_RATE_WINDOW:-1h}
      EMAIL_CODE_IP_RATE_REQUESTS: ${EMAIL_CODE_IP_RATE_REQUESTS:-30}
      EMAIL_CODE_IP_RATE_WINDOW: ${EMAIL_CODE_IP_RATE_WINDOW:-1h}
      EMAIL_VERIFY_USER_RATE_REQUESTS: ${EMAIL_VERIFY_USER_RATE_REQUESTS:-20}
      EMAIL_VERIFY_USER_RATE_WINDOW: ${EMAIL_VERIFY_USER_RATE_WINDOW:-15m}
      EMAIL_VERIFY_IP_RATE_REQUESTS: ${EMAIL_VERIFY_IP_RATE_REQUESTS:-100}
      EMAIL_VERIFY_IP_RATE_WINDOW: ${EMAIL_VERIFY_IP_RATE_WINDOW:-15m}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?set AUTH_TOKEN_SECRET in .env}
      STORAGE_ENDPOINT: minio:9000
      STORAGE_PUBLIC_URL: https://${NAFIR_DOMAIN}
      STORAGE_BUCKET: nafir-music
      # The API's own MinIO user, limited to the bucket (deploy/minio-api-user.sh,
      # #217). Until it is set the API falls back to the root credentials.
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER}}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-1073741824}
      MAX_PENDING_UPLOADS: ${MAX_PENDING_UPLOADS:-3}
      TAG_REWRITE_WORKERS: ${TAG_REWRITE_WORKERS:-1}
      PENDING_UPLOAD_TTL: ${PENDING_UPLOAD_TTL:-2h}
      PENDING_CLEANUP_INTERVAL: ${PENDING_CLEANUP_INTERVAL:-10m}
      PENDING_CLEANUP_BATCH: ${PENDING_CLEANUP_BATCH:-100}
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-true}
      REGISTER_RATE_REQUESTS: ${REGISTER_RATE_REQUESTS:-5}
      REGISTER_RATE_WINDOW: ${REGISTER_RATE_WINDOW:-1h}
      LOGIN_RATE_REQUESTS: ${LOGIN_RATE_REQUESTS:-30}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-15m}
      # Sign-in attempts per email from any IP, so spread-out guessing slows down.
      LOGIN_ACCOUNT_RATE_REQUESTS: ${LOGIN_ACCOUNT_RATE_REQUESTS:-10}
      LOGIN_ACCOUNT_RATE_WINDOW: ${LOGIN_ACCOUNT_RATE_WINDOW:-15m}
      ACCOUNT_DELETE_RATE_REQUESTS: ${ACCOUNT_DELETE_RATE_REQUESTS:-5}
      ACCOUNT_DELETE_RATE_WINDOW: ${ACCOUNT_DELETE_RATE_WINDOW:-1h}
      UPLOAD_RESERVATION_USER_RATE_REQUESTS: ${UPLOAD_RESERVATION_USER_RATE_REQUESTS:-120}
      UPLOAD_RESERVATION_USER_RATE_WINDOW: ${UPLOAD_RESERVATION_USER_RATE_WINDOW:-10m}
      UPLOAD_RESERVATION_IP_RATE_REQUESTS: ${UPLOAD_RESERVATION_IP_RATE_REQUESTS:-240}
      UPLOAD_RESERVATION_IP_RATE_WINDOW: ${UPLOAD_RESERVATION_IP_RATE_WINDOW:-10m}
      UPLOAD_COMPLETION_USER_RATE_REQUESTS: ${UPLOAD_COMPLETION_USER_RATE_REQUESTS:-240}
      UPLOAD_COMPLETION_USER_RATE_WINDOW: ${UPLOAD_COMPLETION_USER_RATE_WINDOW:-10m}
      UPLOAD_COMPLETION_IP_RATE_REQUESTS: ${UPLOAD_COMPLETION_IP_RATE_REQUESTS:-480}
      UPLOAD_COMPLETION_IP_RATE_WINDOW: ${UPLOAD_COMPLETION_IP_RATE_WINDOW:-10m}
      PUBLIC_VIEW_RATE_REQUESTS: ${PUBLIC_VIEW_RATE_REQUESTS:-300}
      PUBLIC_VIEW_RATE_WINDOW: ${PUBLIC_VIEW_RATE_WINDOW:-10m}
      PUBLIC_STREAM_RATE_REQUESTS: ${PUBLIC_STREAM_RATE_REQUESTS:-300}
      PUBLIC_STREAM_RATE_WINDOW: ${PUBLIC_STREAM_RATE_WINDOW:-10m}
      # «گزارش تخلف» reports one account may send about store songs.
      # Song identification for visitors without an account, per IP.
      IDENTIFY_ANONYMOUS_RATE_REQUESTS: ${IDENTIFY_ANONYMOUS_RATE_REQUESTS:-10}
      IDENTIFY_ANONYMOUS_RATE_WINDOW: ${IDENTIFY_ANONYMOUS_RATE_WINDOW:-10m}
      # Likes and publish changes one account may make.
      LIKE_RATE_REQUESTS: ${LIKE_RATE_REQUESTS:-120}
      LIKE_RATE_WINDOW: ${LIKE_RATE_WINDOW:-10m}
      STORE_REPORT_RATE_REQUESTS: ${STORE_REPORT_RATE_REQUESTS:-20}
      STORE_REPORT_RATE_WINDOW: ${STORE_REPORT_RATE_WINDOW:-24h}
      # Plays one user may add to their recently played history.
      HISTORY_RATE_REQUESTS: ${HISTORY_RATE_REQUESTS:-60}
      HISTORY_RATE_WINDOW: ${HISTORY_RATE_WINDOW:-10m}
      # Links one user may submit for import (each makes the server fetch a page).
      LINK_IMPORT_USER_RATE_REQUESTS: ${LINK_IMPORT_USER_RATE_REQUESTS:-20}
      LINK_IMPORT_USER_RATE_WINDOW: ${LINK_IMPORT_USER_RATE_WINDOW:-10m}
      # YouTube and Instagram imports through the image's pinned yt-dlp.
      YTDLP_ENABLED: ${YTDLP_ENABLED:-true}
      YTDLP_PROXY_URL: ${YTDLP_PROXY_URL:-}
      YTDLP_MAX_DURATION: ${YTDLP_MAX_DURATION:-30m}
      YTDLP_MAX_CONCURRENT: ${YTDLP_MAX_CONCURRENT:-2}
      # Each messenger bot stays off until its token is set; see README.md.
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BALE_BOT_USERNAME: ${BALE_BOT_USERNAME:-}
      BALE_API_URL: ${BALE_API_URL:-https://tapi.bale.ai}
      BALE_MAX_DOWNLOAD_BYTES: ${BALE_MAX_DOWNLOAD_BYTES:-20971520}
      BALE_PROXY_URL: ${BALE_PROXY_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_MAX_DOWNLOAD_BYTES: ${TELEGRAM_MAX_DOWNLOAD_BYTES:-20971520}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-}
      TRANSCRIPTION_TOKEN: ${TRANSCRIPTION_TOKEN:-}
      # The email /privacy and /delete-account give for questions and deletion.
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      # Where the front page sends visitors to install the Android app (optional).
      ANDROID_APP_URL: ${ANDROID_APP_URL:-}
      # SHA-256 fingerprints of the Android signing certificate, comma-separated.
      # Served in /.well-known/assetlinks.json so rhythmo links open in the app.
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      # Search console ownership tokens for the front page (optional).
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      BOT_PUBLIC_URL: https://${NAFIR_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal, edge]

  transcriber:
    profiles: [transcription]
    image: ${NAFIR_IMAGE_REPO:-ghcr.io/mhdolatabadi/nafir}/transcriber:${NAFIR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TRANSCRIPTION_TOKEN: ${TRANSCRIPTION_TOKEN:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-large-v3-turbo}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-fa}
      TRANSCRIPTION_THREADS: ${TRANSCRIPTION_THREADS:-2}
    volumes:
      - transcription-models:/models
    networks: [edge]
    cpus: 2
    mem_limit: 4g
    # No published ports. Only the API uses this service.

  web:
    image: ${NAFIR_IMAGE_REPO:-ghcr.io/mhdolatabadi/nafir}/web:${NAFIR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    networks: [edge]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nafir
      POSTGRES_USER: nafir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nafir -d nafir"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    # Pin this to the digest the server runs (see README.md, "MinIO image")
    # so a moving tag never changes storage underneath the data.
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # On edge only so Caddy can forward presigned bucket requests; no ports are published.
    networks: [internal, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NAFIR_DOMAIN: ${NAFIR_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    networks: [edge]

networks:
  internal:
    internal: true
  edge:

# These volumes were created while the project was still called "deploy";
# the names are pinned so the database, music and certificates carry over.
volumes:
  transcription-models:
  postgres-data:
    name: deploy_postgres-data
  minio-data:
    name: deploy_minio-data
  caddy-data:
    name: deploy_caddy-data
  caddy-config:
    name: deploy_caddy-config
