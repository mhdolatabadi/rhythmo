{{define "content"}}
<section class="hero">
<h1>{{.Heading}}</h1>
<p>{{.Intro}}</p>
<nav class="chips" aria-label="مرور گنجینه"><a class="button" href="/store">همه‌ی آهنگ‌ها</a><a class="button" href="/store/artists">خواننده‌ها</a><a class="button" href="/store/albums">آلبوم‌ها</a></nav>
</section>
{{if .Items}}
<ol class="list">
{{range .Items}}<li><a class="row" href="{{.Link}}">
<span class="art">{{template "notes"}}</span>
<span class="grow"><span class="title" dir="auto">{{.Name}}</span><span class="sub">{{if .Sub}}<bdi>{{.Sub}}</bdi> · {{end}}{{digits .TrackCount}} آهنگ</span></span>
</a></li>
{{end}}</ol>
{{else}}
<p class="empty">{{.Empty}}</p>
{{end}}
{{template "pager" .}}
{{end}}
