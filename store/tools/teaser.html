<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:V;src:url(../../assets/fonts/Vazirmatn-Bold.ttf);font-weight:800}
@font-face{font-family:V;src:url(../../assets/fonts/Vazirmatn-Regular.ttf);font-weight:400}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070810}
body{font-family:V,sans-serif;color:#f3f4f8}
#bg{position:absolute;inset:0;background:radial-gradient(800px 600px at var(--x1) 20%,#ff626a44,transparent 60%),radial-gradient(900px 700px at var(--x2) 90%,#6a5cff38,transparent 60%),#070810}
.scene{position:absolute;inset:0;opacity:0}
.logo{width:220px;height:220px;border-radius:50px;box-shadow:0 40px 100px #000b}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.center h1{margin:0;font-size:150px;font-weight:800;line-height:1.1}
.center p{margin:0;font-size:52px;color:#c9ccd8}
.phone{position:absolute;top:90px;left:260px;width:430px;height:955px;border-radius:64px;padding:13px;background:linear-gradient(145deg,#2a2d3a,#0b0c12);box-shadow:0 50px 120px #000c,0 0 0 2px #ffffff22}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:52px;display:block}
.text{position:absolute;right:160px;top:0;bottom:0;width:1000px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.text .k{font-size:34px;color:#ff8a90;font-weight:800}
.text h2{margin:0;font-size:88px;white-space:nowrap;line-height:1.2;font-weight:800}
.text p{margin:0;font-size:46px;line-height:1.6;color:#c9ccd8}
.url{font-size:44px;color:#ff626a;direction:ltr}
.pill{display:inline-block;padding:18px 44px;border-radius:999px;background:#ff626a;color:#1a0306;font-size:46px;font-weight:800}
</style></head><body>
<div id="bg"></div>
<div class="scene" id="s0"><div class="center">
<svg class="logo" id="logo0" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0B0D16"/><path fill="#FF626A" d="M135 179A34 34 0 0 1 203 179V343A34 34 0 0 1 135 343ZM135 267A132 132 0 0 1 267 135A34 34 0 0 1 267 203A64 64 0 0 0 203 267Z"/><circle cx="345" cy="189" r="32" fill="#8D7CFF"/><circle cx="345" cy="283" r="32" fill="#8D7CFF" fill-opacity="0.5"/></svg>
<h1 id="t0">ریتمو</h1><p id="p0">کتابخانه‌ی موسیقی ابری تو</p></div></div>
<div id="feat"></div>
<div class="scene" id="s9"><div class="center">
<svg class="logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0B0D16"/><path fill="#FF626A" d="M135 179A34 34 0 0 1 203 179V343A34 34 0 0 1 135 343ZM135 267A132 132 0 0 1 267 135A34 34 0 0 1 267 203A64 64 0 0 0 203 267Z"/><circle cx="345" cy="189" r="32" fill="#8D7CFF"/><circle cx="345" cy="283" r="32" fill="#8D7CFF" fill-opacity="0.5"/></svg>
<h1 style="font-size:120px">ریتمو</h1><span class="pill">رایگان در کافه‌بازار</span><span class="url">rhythmo.ir</span></div></div>
<script>
const feats = [
  ['01-library', 'موسیقی من', 'همه‌ی موسیقی‌هایت یک‌جا', 'آپلود کن و با کیفیت اصلی، بدون فشرده‌سازی دوباره گوش بده.'],
  ['02-now-playing', 'پخش‌کننده', 'پخش‌کننده‌ای خوش‌دست', 'پخش تصادفی، تکرار، صف پخش و سرعت پخش.'],
  ['03-playlists', 'فهرست پخش', 'فهرست پخش بساز', 'به اشتراک بگذار یا با دوستانت با هم بسازید.'],
  ['05-search', 'جست‌وجو', 'هر آهنگی را فوری پیدا کن', 'در نام آهنگ، خواننده و آلبوم.'],
  ['07-ganjineh', 'گنجینه', 'گنجینه‌ی ریتمو', 'آهنگ‌های عمومی را بشنو و به «موسیقی من» ببر.'],
];
const host = document.getElementById('feat');
feats.forEach(([img, k, h, p], i) => {
  host.insertAdjacentHTML('beforeend', `<div class="scene" id="f${i}"><div class="phone"><img src="raw/${img}.png"></div><div class="text"><span class="k">${k}</span><h2>${h}</h2><p>${p}</p></div></div>`);
});
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
const clamp = x => Math.max(0, Math.min(1, x));
// Scene windows in seconds.
const INTRO = [0, 3.2], FEAT = 3.4, OUT = [3.2 + feats.length * FEAT, 3.2 + feats.length * FEAT + 3.6];
window.DURATION = OUT[1];
function vis(el, t, a, b, fade = 0.45) {
  const o = Math.min(clamp((t - a) / fade), clamp((b - t) / fade));
  el.style.opacity = o;
  return o;
}
window.render = t => {
  const bg = document.getElementById('bg');
  bg.style.setProperty('--x1', (70 + 15 * Math.sin(t / 3)) + '%');
  bg.style.setProperty('--x2', (20 + 15 * Math.cos(t / 4)) + '%');
  // Intro.
  vis(document.getElementById('s0'), t, -1, INTRO[1]);
  const l = ease((t - 0.1) / 0.9);
  document.getElementById('logo0').style.transform = `scale(${0.6 + 0.4 * l}) rotate(${(1 - l) * -12}deg)`;
  document.getElementById('t0').style.transform = `translateY(${(1 - ease((t - 0.5) / 0.8)) * 40}px)`;
  document.getElementById('t0').style.opacity = clamp((t - 0.5) / 0.6);
  document.getElementById('p0').style.opacity = clamp((t - 1.0) / 0.6);
  // Features.
  feats.forEach((_, i) => {
    const a = INTRO[1] + i * FEAT, b = a + FEAT + 0.2;
    const el = document.getElementById('f' + i);
    vis(el, t, a, b);
    const k = ease((t - a) / 0.9);
    el.querySelector('.phone').style.transform = `translateY(${(1 - k) * 120}px) rotate(${(1 - k) * -3}deg)`;
    el.querySelector('.text').style.transform = `translateX(${(1 - ease((t - a - 0.15) / 0.9)) * -60}px)`;
    // A slow scroll of the screenshot keeps it alive.
    el.querySelector('img').style.transform = `scale(${1 + 0.03 * clamp((t - a) / FEAT)})`;
  });
  // Outro.
  vis(document.getElementById('s9'), t, OUT[0], 99);
  document.querySelector('#s9 .logo').style.transform = `scale(${0.8 + 0.2 * ease((t - OUT[0]) / 0.8)})`;
};
render(0);
</script></body></html>
